name: Backend CI

on:
  push:
    branches:
      # Workflow triggered when code is pushed to these branches
      - main
      - dev

  pull_request:
    branches:
      # Workflow triggered when a PR targets these branches
      - main
      - dev

jobs:
  run_back_ci:
    # Define the operating system for the CI runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Clones the repository so the workflow can access the code
        uses: actions/checkout@v5

      - name: Setup Node.js
        # Sets up the Node.js environment for the CI pipeline
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Enables dependency caching to speed up installs
          cache: npm

      - name: Install dependencies
        # Installs project dependencies using clean install / npm install installs dependencies and may update the package-lock.json, while npm ci performs a clean, deterministic install strictly based on the package-lock.json without modifying it.
        run: npm i

      - name: Validate project
        # Runs project checks (linting, type-checking, etc.)
        run: npm run check

      # - name: Unit tests project
      #   # Run units tests
      #   run: npm run test:unit

      # - name: Integration tests projectx
      #   # Run integration tests
      #   run: npm run test:integration