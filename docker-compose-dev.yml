services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  database:
    image: postgres:18-alpine
    container_name: lapince-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_INTERNAL_PORT}"
    volumes:
      # Persist PostgreSQL data between container restarts
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Express API
  # ---------------------------------------------------------------------------
  api:
    build:
      dockerfile: src/Dockerfile
      # Use the "dev" stage defined in the Dockerfile
      target: dev
    container_name: lapince-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${API_INTERNAL_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${API_PORT}:${API_INTERNAL_PORT}"
    volumes:
      # Sync project files with the container for hot reload
      - ./:/app
      # Prevent local node_modules from overwriting container dependencies
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${API_INTERNAL_PORT} || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Adminer Database UI
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: lapince-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_LOCAL_PORT}:${ADMINER_INTERNAL_PORT}"
    depends_on:
      database:
        condition: service_healthy

# -----------------------------------------------------------------------------
# Docker Volumes
# -----------------------------------------------------------------------------
volumes:
  # Persistent PostgreSQL storage
  postgres_data: