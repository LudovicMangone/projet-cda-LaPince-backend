tags:
  - name: Operations
    description: Gestion des dépenses d'un projet

components:
  schemas:
    OperationParticipantInput:
      type: object
      required:
        - participantId
        - repartitionAmount
        - isRepartitionAmountCalculated
      properties:
        participantId:
          type: integer
          minimum: 1
          example: 2
        repartitionAmount:
          type: number
          minimum: 0
          description: Part de la dépense attribuée au participant
          example: 50
        isRepartitionAmountCalculated:
          type: boolean
          description: Indique si la répartition a été calculée automatiquement
          example: false

    OperationBody:
      type: object
      required:
        - name
        - amount
        - date
        - isAmountCalculated
        - categoryId
        - projectId
        - payerParticipantId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Restaurant
        amount:
          type: number
          minimum: 0.01
          description: Montant total de l'operation
          example: 100
        date:
          type: string
          format: date
          example: "2026-06-11"
        isAmountCalculated:
          type: boolean
          description: Indique si le montant total a été calculé automatiquement
          example: false
        categoryId:
          type: integer
          minimum: 1
          example: 1
        projectId:
          type: integer
          minimum: 1
          description: Identifiant du projet. Doit correspondre au projet de l'URL.
          example: 1
        payerParticipantId:
          type: integer
          minimum: 1
          description: Identifiant du participant qui a payé
          example: 2
        operationParticipants:
          type: array
          description: Répartition de la dépense entre les participants
          items:
            $ref: "#/components/schemas/OperationParticipantInput"

    OperationParticipant:
      type: object
      properties:
        repartitionAmount:
          type: number
          example: 50
        isRepartitionAmountCalculated:
          type: boolean
          example: false
        participant:
          type: object
          properties:
            id:
              type: integer
              example: 2
            name:
              type: string
              example: Alice

    Operation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Restaurant
        appUserId:
          type: integer
          example: 42
        categoryId:
          type: integer
          example: 1
        amount:
          type: number
          example: 100
        isAmountCalculated:
          type: boolean
          example: false
        date:
          type: string
          format: date-time
          example: "2026-06-11T00:00:00.000Z"
        payerParticipantId:
          type: integer
          example: 2
        appUser:
          type: object
          properties:
            id:
              type: integer
              example: 42
            name:
              type: string
              example: Michel
        operationParticipants:
          type: array
          items:
            $ref: "#/components/schemas/OperationParticipant"

    OperationMutationResponse:
      type: object
      properties:
        operations:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Restaurant
            amount:
              type: number
              example: 100
            date:
              type: string
              format: date-time
              example: "2026-06-11T00:00:00.000Z"
            projectId:
              type: integer
              example: 1
            categoryId:
              type: integer
              example: 1
            payerParticipantId:
              type: integer
              example: 2
            isAmountCalculated:
              type: boolean
              example: false
            appUserId:
              type: integer
              example: 42

  parameters:
    ProjectIdPathParam:
      in: path
      name: projectId
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant du projet
      example: 1

    OperationIdPathParam:
      in: path
      name: operationId
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant de l'operation
      example: 1

paths:
  /api/projects/{projectId}/operations:
    get:
      tags:
        - Operations
      summary: Lister les operations d'un projet
      description: Retourne toutes les operations du projet si l'utilisateur connecté en est propriétaire.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIdPathParam"
      responses:
        "200":
          description: Liste des operations du projet
          content:
            application/json:
              schema:
                type: object
                properties:
                  operations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Operation"
              example:
                operations:
                  - id: 1
                    name: Restaurant
                    appUserId: 42
                    categoryId: 1
                    amount: 100
                    isAmountCalculated: false
                    date: "2026-06-11T00:00:00.000Z"
                    payerParticipantId: 2
                    appUser:
                      id: 42
                      name: Michel
                    operationParticipants:
                      - repartitionAmount: 50
                        isRepartitionAmountCalculated: false
                        participant:
                          id: 2
                          name: Alice
                      - repartitionAmount: 50
                        isRepartitionAmountCalculated: false
                        participant:
                          id: 3
                          name: Bob
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    post:
      tags:
        - Operations
      summary: Créer une operation dans un projet
      description: Crée une dépense dans le projet et déclenche la vérification des alertes budgetaires.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationBody"
            example:
              projectId: 1
              name: Restaurant
              amount: 100
              date: "2026-06-11"
              categoryId: 1
              payerParticipantId: 2
              isAmountCalculated: false
              operationParticipants:
                - participantId: 2
                  repartitionAmount: 50
                  isRepartitionAmountCalculated: false
                - participantId: 3
                  repartitionAmount: 50
                  isRepartitionAmountCalculated: false
      responses:
        "200":
          description: Operation créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationMutationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/projects/{projectId}/operations/{operationId}:
    patch:
      tags:
        - Operations
      summary: Modifier une operation
      description: Met à jour une operation existante et recrée sa répartition entre participants.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIdPathParam"
        - $ref: "#/components/parameters/OperationIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationBody"
            example:
              projectId: 1
              name: Courses
              amount: 80
              date: "2026-06-11"
              categoryId: 1
              payerParticipantId: 2
              isAmountCalculated: false
              operationParticipants:
                - participantId: 2
                  repartitionAmount: 40
                  isRepartitionAmountCalculated: false
                - participantId: 3
                  repartitionAmount: 40
                  isRepartitionAmountCalculated: false
      responses:
        "200":
          description: Operation modifiée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationMutationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags:
        - Operations
      summary: Supprimer une operation
      description: Supprime une operation du projet et résout les alertes si nécessaire.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIdPathParam"
        - $ref: "#/components/parameters/OperationIdPathParam"
      responses:
        "204":
          description: Operation supprimée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
