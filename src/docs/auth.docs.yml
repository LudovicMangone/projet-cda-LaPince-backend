tags:
  - name: Auth
    description: Inscription, connexion, déconnexion et récupération de l'utilisateur connecté

paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Inscription d'un nouvel utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Michel
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: michel@lapince.fr
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: "Doit contenir : 1 majuscule, 1 minuscule, 1 chiffre"
                  example: MonMotDePasse1
      responses:
        "201":
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserPublic"
              example:
                user:
                  id: 1
                  name: Michel
                  email: michel@lapince.fr
        "409":
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                error: Cet email est déjà utilisé
        "422":
          description: Données invalides — échec de validation Zod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZodErrorResponse"
              example:
                status: 422
                error: "✗ Invalid email address\n → at email"

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Connexion et retour du token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: michel@lapince.fr
                password:
                  type: string
                  minLength: 1
                  example: MonMotDePasse1
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserPublic"
                  token:
                    type: string
                    description: Token JWT signé 
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              example:
                user:
                  id: 1
                  name: Michel
                  email: michel@lapince.fr
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: Email ou mot de passe incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 401
                error: Email ou mot de passe incorrect
        "422":
          description: Données invalides — échec de validation Zod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZodErrorResponse"
              example:
                status: 422
                error: "✗ Invalid email address\n → at email"

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Déconnexion
      description: >
        Invalide la session côté client.
        Le token JWT doit être supprimé par le frontend (localStorage).
        Aucune invalidation serveur — le token reste techniquement valide jusqu'à expiration.
      responses:
        "200":
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Déconnexion réussie
        

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Récupérer l'utilisateur connecté
      description: >
        Vérifie la validité du token JWT et retourne les informations de l'utilisateur connecté.
        Utilisé au chargement de l'application pour hydrater le contexte d'authentification.
      responses:
        "200":
          description: Utilisateur connecté retourné avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserPublic"
              example:
                user:
                  id: 1
                  name: Michel
                  email: michel@lapince.fr
        "401":
          description: Token manquant, expiré ou invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 401
                error: Token expiré ou invalide

components:
  schemas:
    # Profil utilisateur retourné par l'API
    # Champs : id, name, email uniquement — password exclu via select Prisma
    UserPublic:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Michel
        email:
          type: string
          format: email
          example: michel@lapince.fr

    # Réponse d'erreur standard — HttpError (401, 403, 404, 409...)
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: Token manquant ou invalide

    # Réponse d'erreur Zod — validation échouée (422)
    # error contient le message formaté par z.prettifyError()
    ZodErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 422
        error:
          type: string
          description: Message formaté par z.prettifyError() — liste les champs invalides
          example: "✗ Invalid email address\n → at email"

  responses:
    Unauthorized:
      description: Token manquant ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 401
            error: Token manquant ou invalide
    Forbidden:
      description: Accès refusé à cette ressource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 403
            error: Accès refusé
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 404
            error: Ressource introuvable
    Conflict:
      description: Conflit — la ressource existe déjà
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 409
            error: Cet email est déjà utilisé
    UnprocessableEntity:
      description: Données invalides — échec de validation Zod
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ZodErrorResponse"
          example:
            status: 422
            error: "✗ Invalid email address\n → at email"