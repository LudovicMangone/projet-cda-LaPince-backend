tags:
  - name: Projects
    description: Gestion des projets de dépenses partagées

components:
  schemas:
    ProjectType:
      type: string
      enum:
        - Voyage
        - Maison_Coloc
        - Anniversaire
        - Repas_Sortie
        - Pro_Travail
        - Autre

    BudgetInput:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          example: 1000
        alertEnabled:
          type: boolean
          default: false
        limitCriteria:
          type: number
          minimum: 1
          maximum: 100
          default: 80
          example: 80

    ParticipantInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Alice
        isMe:
          type: boolean
          example: true

    ProjectCreateBody:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Voyage à Barcelone
        description:
          type: string
          maxLength: 1000
          example: Weekend entre amis
        type:
          $ref: "#/components/schemas/ProjectType"
        budget:
          $ref: "#/components/schemas/BudgetInput"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantInput"

    ProjectSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Voyage à Barcelone
        type:
          $ref: "#/components/schemas/ProjectType"
        isArchived:
          type: boolean
          example: false
        updatedAt:
          type: string
          format: date-time
        operationsCount:
          type: integer
          example: 3
        participants:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              appUserId:
                type: integer
                nullable: true
        budget:
          nullable: true
          type: object
          properties:
            limit:
              type: number
              example: 1000
            limitCriteria:
              type: number
              example: 80
            spent:
              type: number
              example: 250
            unreadAlertsCount:
              type: integer
              example: 1
        userBalance:
          type: number
          nullable: true
          description: "Solde net de l'utilisateur (positif = on lui doit, négatif = il doit)"
          example: 42.5

    PaginatedProjects:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        nextCursor:
          type: integer
          nullable: true
          example: 5
        hasMore:
          type: boolean
          example: false
        total:
          type: integer
          example: 2

paths:
  /api/projects:
    get:
      tags:
        - Projects
      summary: Dashboard — liste paginée des projets
      description: >
        Retourne les projets de l'utilisateur connecté (5 par page, cursor-based).
        Chaque projet inclut le nombre d'opérations, les participants, le budget consommé
        et le solde net de l'utilisateur dans ce projet.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: integer
          description: ID du dernier projet de la page précédente (pagination)
          example: 5
      responses:
        "200":
          description: Liste paginée de projets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProjects"
              example:
                projects:
                  - id: 1
                    name: Voyage à Barcelone
                    type: Voyage
                    isArchived: false
                    updatedAt: "2026-06-10T08:00:00.000Z"
                    operationsCount: 3
                    participants:
                      - id: 1
                        name: Alice
                        appUserId: 42
                      - id: 2
                        name: Bob
                        appUserId: null
                    budget:
                      limit: 800
                      limitCriteria: 80
                      spent: 250
                      unreadAlertsCount: 0
                    userBalance: 50
                nextCursor: null
                hasMore: false
                total: 1
        "401":
          description: Token manquant ou invalide

    post:
      tags:
        - Projects
      summary: Créer un nouveau projet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateBody"
            example:
              name: Voyage à Rome
              type: Voyage
              budget:
                amount: 800
                alertEnabled: true
                limitCriteria: 80
              participants:
                - name: Alice
                  isMe: true
                - name: Bob
      responses:
        "201":
          description: Projet créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Voyage à Rome
                      description:
                        type: string
                        nullable: true
                      type:
                        $ref: "#/components/schemas/ProjectType"
                      isArchived:
                        type: boolean
                        example: false
                      createdAt:
                        type: string
                        format: date-time
                      budget:
                        nullable: true
                        type: object
                        properties:
                          amount:
                            type: number
                          limitCriteria:
                            type: number
                      projectParticipants:
                        type: array
                        items:
                          type: object
                          properties:
                            participant:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
        "401":
          description: Token manquant ou invalide
        "422":
          description: Données invalides (Zod)
